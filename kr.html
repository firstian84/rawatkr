<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <style>
        :root {
            --bg: #000;
            --surface: #111;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --error: #ff5252;
            --warning: #ffd740;
            --text-dim: #444; /* Warna untuk elemen non-aktif */
            --text-active: #888;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 10px;
            overflow-x: hidden;
        }

        /* --- ANIMATIONS --- */
        @keyframes blink-red {
            0% { opacity: 1; box-shadow: 0 0 15px var(--error); }
            50% { opacity: 0.6; box-shadow: 0 0 0px var(--error); }
            100% { opacity: 1; box-shadow: 0 0 15px var(--error); }
        }

        @keyframes glow-yellow {
            0% { box-shadow: 0 0 5px var(--warning); }
            100% { box-shadow: 0 0 15px var(--warning); }
        }

        .blink-urgent { animation: blink-red 0.8s infinite; border-color: var(--error) !important; }
        .glow-warning { animation: glow-yellow 1.5s infinite alternate; border-color: var(--warning) !important; }

        /* --- UI COMPONENTS --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-actions { display: flex; gap: 8px; }
        .fs-btn { background: transparent; border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 8px; font-size: 10px; cursor: pointer; }

        .health-card { background: linear-gradient(145deg, #1a1a1a, #000); border: 1px solid #333; padding: 15px; border-radius: 20px; text-align: center; margin-bottom: 10px; position: relative; }
        .health-circle { width: 70px; height: 70px; border-radius: 50%; border: 6px solid #222; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 20px; font-weight: 900; }
        #sync-status { position: absolute; top: 10px; right: 15px; font-size: 8px; color: var(--secondary); opacity: 0.7; }

        .section-header { font-size: 10px; font-weight: 800; color: var(--primary); text-transform: uppercase; margin: 15px 0 5px 5px; letter-spacing: 1px; border-left: 2px solid var(--primary); padding-left: 8px; }

        .card-grid { display: flex; flex-direction: column; gap: 6px; }
        
        .part-card { 
            background: var(--surface); 
            padding: 10px 12px; 
            border-radius: 12px; 
            border: 1px solid #222; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            transition: all 0.4s ease;
        }

        .part-info { flex: 1; }
        .progress-bar { height: 4px; background: #222; border-radius: 2px; margin: 6px 0; overflow: hidden; width: 85%; }
        .progress-fill { height: 100%; width: 0%; transition: 0.5s; }
        
        .info-row { display: flex; gap: 10px; align-items: center; }
        .info { font-size: 10px; color: var(--text-active); }
        .remaining { font-size: 10px; font-weight: 800; }

        .btn-edit { 
            background: #222; 
            border: 1px solid #333; 
            color: var(--primary); 
            padding: 8px 10px; 
            border-radius: 8px; 
            font-size: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase;
        }

        @media (min-width: 1024px) {
            .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
        }

        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal { background: #1a1a1a; width: 85%; max-width: 350px; padding: 20px; border-radius: 25px; border: 1px solid var(--primary); text-align: center; }
        .modal input { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 10px; margin: 10px 0; box-sizing: border-box; font-size: 14px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-save { background: var(--primary); color: #000; }
        .btn-cancel { background: #333; color: #fff; }

        .urgent-text { color: var(--error) !important; }
        .warning-text { color: var(--warning) !important; }
        .safe-text { color: var(--secondary); }
    </style>
</head>
<body onclick="initAudio()"> 
    <div class="header">
        <h2 style="margin:0; font-size: 14px; letter-spacing: 1px;"><span style="color:var(--primary)"></span> <span style="color:var(--text-active)"></span></h2>
        <div class="header-actions">
            <button class="fs-btn" onclick="openSettings()" style="border-color: var(--primary); color: var(--primary);">⚙️ SETTINGS</button>
            <button class="fs-btn" onclick="toggleFS()">⛶ FS</button>
        </div>
    </div>

    <div class="health-card">
        <div id="sync-status">Cloud Ready</div>
        <div id="health-score" class="health-circle">0%</div>
        <div>
            <div id="health-status" style="font-size: 14px; font-weight: bold;">Menganalisa...</div>
            <div id="acc-total" style="font-size: 10px; color: var(--text-active);">Ketuk layar untuk suara</div>
        </div>
    </div>

    <div class="section-header">Mesin & Transmisi</div>
    <div class="card-grid" id="engine-parts"></div>

    <div class="section-header">Komponen Kaki-Kaki</div>
    <div class="card-grid" id="wheel-parts"></div>

    <div class="section-header">Sistem Kelistrikan</div>
    <div class="card-grid" id="electric-parts"></div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <div id="modal-part-name" style="font-weight: bold; color: var(--primary); margin-bottom: 5px;">Part Name</div>
            <input type="date" id="date-picker">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">BATAL</button>
                <button class="btn-save" onclick="saveDate()">SIMPAN</button>
            </div>
        </div>
    </div>

    <div id="settings-overlay" class="modal-overlay">
        <div class="modal">
            <div style="font-weight: bold; color: var(--secondary);">LIMIT SETTINGS (HARI)</div>
            <div id="settings-container" style="max-height: 50vh; overflow-y: auto; margin: 15px 0;"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSettings()">TUTUP</button>
                <button class="btn-save" style="background: var(--secondary);" onclick="saveSettings()">UPDATE</button>
            </div>
        </div>
    </div>

<script>
    const REDIS_URL = "https://enabled-crayfish-71186.upstash.io";
    const REDIS_TOKEN = "gQAAAAAAARYSAAIncDE2MzUzMjQ5Mzg2N2E0YzU2OTUxODJjZWNmY2E2NzkyMXAxNzExODY";
    
    let storage = JSON.parse(localStorage.getItem('motoServiceV4')) || {};
    let savedLimits = JSON.parse(localStorage.getItem('motoLimitsV4')) || {};
    
    let audioCtx = null, audioInterval = null, isAudioInitialized = false;

    const partConfig = [
        { id: 'oliM', name: 'Oli Mesin', icon: '🛢️', area: 'engine' },
        { id: 'oliG', name: 'Oli Gardan', icon: '💧', area: 'engine' },
        { id: 'cvt', name: ' CVT', icon: '⚙️', area: 'engine' },
        { id: 'tBelt', name: 'Timing Belt', icon: '🎗️', area: 'engine' },
        { id: 'filter', name: 'Filter Udara', icon: '🌬️', area: 'engine' },
        { id: 'masterR', name: 'Master Rem', icon: '✊', area: 'engine' },
        { id: 'remF', name: 'Kampas Depan', icon: '🛑', area: 'wheel' },
        { id: 'tireF', name: 'Ban Depan', icon: '🔘', area: 'wheel' },
        { id: 'remR', name: 'Kampas Blkg', icon: '🛑', area: 'wheel' },
        { id: 'tireR', name: 'Ban Belakang', icon: '🔘', area: 'wheel' },
        { id: 'aki', name: 'Aki', icon: '🔋', area: 'electric' },
        { id: 'lightF', name: 'Lampu Dpn', icon: '💡', area: 'electric' },
        { id: 'lightR', name: 'Lampu Blk', icon: '🚨', area: 'electric' },
        { id: 'signL', name: 'Sein L', icon: '⬅️', area: 'electric' },
        { id: 'signR', name: 'Sein R', icon: '➡️', area: 'electric' }
    ];

    function initAudio() {
        if (!isAudioInitialized) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isAudioInitialized = true;
            document.getElementById('acc-total').innerText = "Audio: Aktif";
            render();
        }
    }

    function playBeep(freq, dur) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(g);
        g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    }

    async function syncToCloud() {
        const statusEl = document.getElementById('sync-status');
        statusEl.innerText = "☁️ Syncing...";
        try {
            const data = { serviceData: storage, limitData: savedLimits };
            await fetch(`${REDIS_URL}/set/motoCare`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${REDIS_TOKEN}` },
                body: JSON.stringify(data)
            });
            statusEl.innerText = "✅ Cloud Synced";
        } catch (e) { statusEl.innerText = "❌ Sync Failed"; }
    }

    async function loadFromCloud() {
        try {
            const resp = await fetch(`${REDIS_URL}/get/motoCare`, { headers: { Authorization: `Bearer ${REDIS_TOKEN}` } });
            const cloud = await resp.json();
            if (cloud && cloud.result) {
                const master = typeof cloud.result === 'string' ? JSON.parse(cloud.result) : cloud.result;
                storage = master.serviceData || storage;
                savedLimits = master.limitData || savedLimits;
                render();
            }
        } catch (e) {}
    }

    function render() {
        ['engine', 'wheel', 'electric'].forEach(a => document.getElementById(`${a}-parts`).innerHTML = '');
        const now = new Date();
        let totalHealth = 0, activeCount = 0, hasUrgent = false, hasWarning = false;

        partConfig.forEach(p => {
            if(!storage[p.id]) storage[p.id] = now.toISOString().split('T')[0];
            const limit = savedLimits[p.id] || 0;
            const isOff = limit === 0;
            const diffDays = Math.floor((now - new Date(storage[p.id])) / 86400000);
            const remaining = limit - diffDays;
            const healthPct = isOff ? 0 : Math.max(0, Math.min(100, (remaining / limit) * 100));

            if (!isOff) { totalHealth += healthPct; activeCount++; }

            let anim = "";
            if (!isOff) {
                if (remaining <= 0) { anim = "blink-urgent"; hasUrgent = true; }
                else if (remaining <= limit / 2) { anim = "glow-warning"; hasWarning = true; }
            }

            const cardBg = isOff ? 'linear-gradient(145deg, #050505, #111)' : 'var(--surface)';
            const opac = isOff ? '0.35' : '1';

            const card = `
                <div class="part-card ${anim}" style="background: ${cardBg}; opacity: ${opac}; border: ${isOff ? '1px dashed #222' : '1px solid #222'}">
                    <div class="part-info">
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <span style="font-size:12px; filter:${isOff ? 'grayscale(1)' : ''}">${p.icon}</span>
                            <span style="font-size: 11px; font-weight: 700; color:${isOff ? '#555' : '#fff'}">${p.name}</span>
                        </div>
                        <div class="progress-bar" style="background: ${isOff ? '#050505' : '#222'}">
                            <div class="progress-fill" style="width: ${healthPct}%; background: ${remaining <= 0 ? 'var(--error)' : (remaining <= limit/2 ? 'var(--warning)' : 'var(--secondary)')}"></div>
                        </div>
                        <div class="info-row">
                            <div class="info">${isOff ? 'DISABLED' : diffDays + '/' + limit + ' hari'}</div>
                            <div class="remaining ${remaining <= 0 && !isOff ? 'urgent-text' : (remaining <= limit/2 && !isOff ? 'warning-text' : 'safe-text')}" style="${isOff ? 'color:#333 !important' : ''}">
                                ${isOff ? 'OFF' : (remaining <= 0 ? '🚨 GANTI' : remaining + ' hari')}
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 4px; margin-left: 10px;">
                        <button class="btn-edit" onclick="openModal('${p.id}', '${p.name}')">SET</button>
                        <button class="btn-edit" style="color: ${isOff ? 'var(--secondary)' : 'var(--error)'};" onclick="togglePart('${p.id}', ${isOff})">
                            ${isOff ? 'ON' : 'OFF'}
                        </button>
                    </div>
                </div>`;
            document.getElementById(`${p.area}-parts`).innerHTML += card;
        });

        const avg = activeCount > 0 ? Math.round(totalHealth / activeCount) : 0;
        document.getElementById('health-score').innerText = avg + '%';
        document.getElementById('health-status').innerText = avg > 80 ? "NORMAL" : (avg > 50 ? "CEK" : "SERVIS!");

        if (audioInterval) clearInterval(audioInterval);
        if (isAudioInitialized) {
            if (hasUrgent) audioInterval = setInterval(() => playBeep(880, 0.1), 1000);
            else if (hasWarning) audioInterval = setInterval(() => playBeep(440, 0.05), 3000);
        }
    }

    async function togglePart(id, isOff) {
        if (isOff) {
            savedLimits[id] = 30; // Aktifkan ke default 30 hari
        } else {
            savedLimits[id] = 0; // LANGSUNG SET 0 (OFF)
        }
        localStorage.setItem('motoLimitsV4', JSON.stringify(savedLimits));
        render();
        await syncToCloud();
    }

    let activeId = null;
    function openModal(id, name) { 
        activeId = id; 
        document.getElementById('modal-part-name').innerText = name; 
        document.getElementById('date-picker').value = storage[id]; 
        document.getElementById('modal-overlay').style.display = 'flex'; 
    }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    async function saveDate() { 
        storage[activeId] = document.getElementById('date-picker').value; 
        localStorage.setItem('motoServiceV4', JSON.stringify(storage)); 
        render(); closeModal(); await syncToCloud();
    }

    function openSettings() { 
        const c = document.getElementById('settings-container'); 
        c.innerHTML = ''; 
        partConfig.forEach(p => { 
            c.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #222">
                <label style="font-size:11px;">${p.icon} ${p.name}</label>
                <input type="number" data-id="${p.id}" value="${savedLimits[p.id] || 0}" style="width:50px; background:#000; border:1px solid #333; color:var(--primary); text-align:center; border-radius:5px">
            </div>`; 
        }); 
        document.getElementById('settings-overlay').style.display = 'flex'; 
    }
    function closeSettings() { document.getElementById('settings-overlay').style.display = 'none'; }
    async function saveSettings() { 
        document.querySelectorAll('#settings-container input').forEach(i => savedLimits[i.dataset.id] = parseInt(i.value) || 0); 
        localStorage.setItem('motoLimitsV4', JSON.stringify(savedLimits)); 
        render(); closeSettings(); await syncToCloud();
    }

    function toggleFS() { 
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    window.onload = async () => { render(); await loadFromCloud(); };
</script>
</body>
</html>
